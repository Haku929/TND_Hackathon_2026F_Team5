# 4 argon lowの案を基に、定義・表記を修正し、highの具体例を一部取り入れたレビュー案。
# ID・分野名・順序はfields_catalog.jsonに合わせる。misconceptionは誤解そのものを書く。
- id: philosophy-ethics
  name: 哲学・倫理学
  summary: 存在・知識・善悪など当たり前とされている前提を疑い、概念の整理と論理的な議論によって物事の根本的な根拠や規範を問い直す学問です。
  misconception: 答えの出ない空論
  terms:
    - term: 功利主義
      description: 社会全体の幸福や利益が最も大きくなる選択を正しいとする、政策や日常の意思決定にも関わる考え方です。
    - term: 義務論
      description: 結果の良し悪しにかかわらず、人として守るべきルールや道徳的義務を基準に正しさを判断する立場です。
    - term: 認識論
      description: 「本当に知っている」とはどういうことか、知識と単なる思い込みの違いや根拠の確かさを調べる領域です。
    - term: 応用倫理学
      description: 医療、環境、情報技術など現代の具体的な問題に対して、何が許され何が望ましいかを議論する分野です。

- id: linguistics
  name: 言語学
  summary: 私たちが普段話したり書いたりする言葉の音声・文法・意味・使われ方を観察し、人間の言語に共通する仕組みや変化の法則を科学的に解明する学問です。
  misconception: たくさんの外国語を話せるようになる勉強
  terms:
    - term: 音韻論
      description: 言語ごとにどのような音のまとまりが意味の違いを作るかを整理し、発音の背後にある規則を探る分野です。
    - term: 統語論
      description: 単語がどのような順番や結び付きで並ぶと自然な文になるのか、文の組み立てのルールを分析する分野です。
    - term: 語用論
      description: 文字どおりの意味だけでなく、会話の場面や相手との関係によって意図がどう伝わるかを調べる領域です。
    - term: コーパス言語学
      description: 実際に使われた大量の文章や会話のデータを集め、言葉の使われ方の傾向を客観的に分析する手法です。

- id: literature
  name: 文学
  summary: 小説・詩・戯曲などの作品を言葉の表現や時代背景、語りの構造から丁寧に読み解き、人間の感情や社会のあり方がどう描かれてきたかを探究する学問です。
  misconception: 本を読んで個人の感想を語り合うこと
  terms:
    - term: 物語論
      description: 誰の視点でどの順番に出来事が語られるかなど、物語が読者を引き込む仕組みや構造を分析する理論です。
    - term: テクスト批評
      description: 写本や初版などの違いを比べたり表現を精査したりして、作品の成り立ちや正確な本文を確かめる研究手法です。
    - term: 比較文学
      description: 国や言語の枠を越えて作品同士の影響関係や共通するテーマを調べ、文化のつながりを明らかにする分野です。
    - term: 表象
      description: 家族、都市、ジェンダー、戦争などが作品の中でどのようなイメージや言葉として描かれているかを捉える概念です。

- id: history
  name: 歴史学
  summary: 文書・写真・モノ・語りなどの史料を吟味し、過去の人々の暮らしや出来事の背景、社会が変化した道筋を実証的に明らかにする学問です。
  misconception: 年号や偉人の名前を暗記する科目
  terms:
    - term: 史料批判
      description: 史料がいつ、誰によって、何のために残されたかを確かめ、信頼性や偏り、そこから読み取れることの限界を検討する作業です。
    - term: 一次史料
      description: 調査したい時代の当事者が直接残した手紙、公文書、日記など、歴史を裏付ける直接の手がかりとなる記録です。
    - term: 社会史
      description: 政治の中心にいた権力者だけでなく、当時の普通の人々の暮らしや習慣、家族の姿から時代を捉えるアプローチです。
    - term: グローバル・ヒストリー
      description: 一つの国の枠にとらわれず、交易や人の移動、感染症など地域を越えたつながりから世界の歴史を描く視点です。

- id: archaeology-cultural-heritage
  name: 考古学・文化遺産学
  summary: 遺跡や遺物などの物質的な痕跡を発掘・分析して過去の人間の営みを復元するとともに、歴史的建造物や文化財を保存し未来へ継承する方法を探る学問です。
  misconception: 宝探しや土器を掘るだけの作業
  terms:
    - term: 層位学
      description: 地面に積み重なった土の層の順番を調べることで、見つかった道具や建物の新旧関係を判断する基本的な方法です。
    - term: 放射性炭素年代測定
      description: 木片や骨などに残る炭素14の割合を測り、生物が死んだ後に炭素14が減る性質を利用して年代を推定する技術です。
    - term: 保存科学
      description: 温度・湿度・光や材質の劣化を調べ、古い絵画や建造物、出土品を傷めずに長く残すための科学的な手法です。
    - term: オーセンティシティ
      description: 文化財や遺跡を修理・保存する際に、元の材料や技術、歴史的な価値がどれだけ本物として保たれているかを示す考え方です。

- id: geography
  name: 地理学
  summary: 地形・気候などの自然環境と、都市・産業・人々の暮らしとの空間的な関わりを、地図やフィールドワーク、位置データを用いて解明する学問です。
  misconception: 地名や特産品を丸暗記する科目
  terms:
    - term: 地理情報システム
      description: 地図の上に人口、土地利用、交通、災害リスクなどのデータを重ね合わせ、場所ごとの特徴や課題を可視化・分析する仕組みです。
    - term: フィールドワーク
      description: 実際の地域へ足を運び、景観の観察や住民への聞き取り、測量などを通じて現地の生きた情報を集める調査手法です。
    - term: 都市構造
      description: 住宅地、商業地、工業地などが都市の中でどう配置され、通勤や買い物の流れとどう結びついているかを捉える概念です。
    - term: 人間環境相互作用
      description: 地形や気候が人の暮らしにどう影響し、逆に人間の開発や生活が自然環境をどう変えているかを双方向から見る視点です。

- id: regional-studies
  name: 地域研究
  summary: 特定の国や地域について、現地調査、文献、統計などを組み合わせ、歴史・文化・政治・経済と人々の生活を総合的に理解する学問です。
  misconception: 外国の観光案内や雑学の寄せ集め
  terms:
    - term: 参与観察
      description: 研究対象の地域やコミュニティに一定期間入り込み、現地の人々と生活を共にしながら内側の視点で社会を理解する調査法です。
    - term: フィールドノート
      description: 現地での日々の観察、人々の会話、気づいた習慣や雰囲気を詳しく書き留め、研究の土台とする記録です。
    - term: 多文化共生
      description: 異なる民族、宗教、言語を持つ人々が同じ地域社会の中でどう折り合いをつけ、共に暮らしているかを捉えるテーマです。
    - term: 在地知
      description: 外からの科学技術や制度だけでなく、その土地で暮らす人々が長い経験の中で培ってきた独自の知恵や生活の工夫です。

- id: law
  name: 法学
  summary: 社会で起こる利害の対立やトラブルに対し、法律の条文や過去の裁判例をもとに公平で筋道の通った解決ルールと制度のあり方を考える学問です。
  misconception: 六法全書の条文を一字一句暗記する勉強
  terms:
    - term: 法解釈
      description: 抽象的に書かれた法律の条文を、具体的な事件や新しい社会問題にどう当てはめるべきか論理的に導き出す作業です。
    - term: 判例
      description: 過去の裁判で裁判所が示した判断の先例であり、似たようなトラブルを公平に解決する際の重要な基準になります。
    - term: 要件・効果
      description: 「どういう条件が揃えば（要件）、どのような法的な結果や権利・義務が生じるか（効果）」を整理して考える法学の基本枠組みです。
    - term: デュー・プロセス
      description: 犯罪の処罰や行政の処分を行う際、結果だけでなく公正で決められた手続きを必ず踏まなければならないという原則です。

- id: political-science
  name: 政治学
  summary: 選挙、議会、行政、世論などの働きを分析し、多様な意見や利害がぶつかる社会でどのように合意をつくり権力を運営・統制するかを解明する学問です。
  misconception: 政治家の裏話や時事ニュースの感想戦
  terms:
    - term: 権力分立
      description: 権力が一つの機関に集中して濫用されるのを防ぐため、立法・行政・司法などに役割を分けて互いに抑制させる仕組みです。
    - term: 投票行動
      description: 有権者が選挙で何を基準に政党や候補者を選び、なぜ投票に行ったり棄権したりするのかをデータや調査で分析する領域です。
    - term: 公共政策
      description: 少子高齢化や地域の課題などに対し、政府や自治体が税金や規制を使ってどのように問題を解決しようとするかの計画と実行です。
    - term: 合意形成
      description: 立場や利害が異なる人々の間で対話や交渉を重ね、社会全体として受け入れられる決定にたどり着くプロセスです。

- id: international-relations
  name: 国際関係学
  summary: 国家だけでなく国際機関、企業、NGOなどが関わる国際社会において、戦争と平和、貿易、環境、人権などの国境を越える課題をどう解決するかを研究する学問です。
  misconception: 外交ニュースの解説や国ごとの力比べの予想
  terms:
    - term: 安全保障
      description: 武力紛争の抑止だけでなく、資源、サイバー攻撃、感染症などから国や人々の安全な暮らしをどう守るかを考える枠組みです。
    - term: グローバル・ガバナンス
      description: 世界全体を統治する政府がない中で、気候変動や難民問題などの地球規模の課題に国連や条約、民間団体が協力して対処する仕組みです。
    - term: 相互依存
      description: 貿易や金融、通信などを通じて国同士が深く結びつき、一国の出来事が他国にも連鎖して影響し合う状態を指します。
    - term: ソフト・パワー
      description: 軍事力や経済制裁のような強制力ではなく、文化の魅力や政治的価値観、外交への信頼によって他国の共感や協力を引き出す力です。

- id: economics
  name: 経済学
  summary: 限られた時間・お金・資源のもとで人々がどう選択するかを数理モデルとデータで分析し、市場の働きや景気、格差、政策の効果を明らかにする学問です。
  misconception: 株の儲け方やお金持ちになる方法を教える勉強
  terms:
    - term: 機会費用
      description: ある選択のために諦めた選択肢のうち、最も価値の高いものの価値です。アルバイトを休んで勉強するときの、得られたはずの賃金などが例です。
    - term: インセンティブ
      description: ポイント還元や罰金、補助金など、人や企業が何を選び、どう行動するかに影響する誘因のことです。
    - term: 市場の失敗
      description: 環境汚染や独占、情報の偏りなどによって、自由な売買だけに任せると社会全体にとって望ましい結果にならない現象です。
    - term: 因果推論
      description: 「教育費を増やすと成績は上がるか」など、原因が結果に与える影響を、実験や観察データから前提条件を確かめながら推定する方法です。

- id: business-administration
  name: 経営学
  summary: 企業や非営利団体などの組織が、変化する社会の中でどのように人材・資金・技術を活かし、新しい価値を生み出しながら持続的に運営するかを解明する学問です。
  misconception: 社長になる人だけが学ぶ成功ノウハウ集
  terms:
    - term: 競争優位
      description: 他の会社には簡単に真似できない技術やブランド、仕組みによって、市場の中で選ばれ続ける独自の強みのことです。
    - term: 組織行動論
      description: 職場での働きがい、リーダーシップ、チームの協力関係など、組織の中で人がどう考え行動するかを分析する領域です。
    - term: マーケティング
      description: 単なる宣伝や売り込みではなく、顧客が本当に求めている価値を見極め、商品開発から届ける仕組みまで全体を設計する活動です。
    - term: イノベーション
      description: 技術の発見だけでなく、新しい製品やサービス、働き方の仕組みを組み合わせて社会の習慣や市場を大きく変える変革のことです。

- id: sociology
  name: 社会学
  summary: 家族、学校、労働、SNSなど身近な人間関係や制度を調査し、個人の悩みや行動の背後にある社会の構造や規範、不平等の仕組みを明らかにする学問です。
  misconception: 社会科の延長や世相についての雑談
  terms:
    - term: 社会化
      description: 人が家庭や学校、地域社会の中で言葉やマナー、価値観を身につけ、社会の一員として振る舞えるようになっていく過程です。
    - term: 社会階層
      description: 収入、学歴、職業などによって社会の中に生じる層のことで、努力だけでは越えにくい機会の格差を分析する手がかりになります。
    - term: ジェンダー
      description: 生物学的な性差ではなく、「男らしさ・女らしさ」や役割分担など、社会や文化の中で作られてきた性別のあり方を捉える概念です。
    - term: 社会調査
      description: アンケートによる統計分析や、当事者への丁寧なインタビューを通じて、世の中の意識や実態を客観的に捉える手法です。

- id: social-welfare
  name: 社会福祉学
  summary: 高齢、障害、貧困、子育ての孤立など生活上の困難を抱える人々に対し、個人の尊厳と自立を支えるための制度設計や相談援助、地域づくりの方法を研究する学問です。
  misconception: 親切心やボランティア精神だけで人を助ける活動
  terms:
    - term: ソーシャルワーク
      description: 生活に困りごとを抱える人に寄り添い、本人の力を引き出しながら医療・行政・地域の支援をつないで問題解決を支える専門的実践です。
    - term: ノーマライゼーション
      description: 障害の有無などにかかわらず、誰もが地域で日常生活を送り、学びや仕事などに参加できる条件を整えようとする理念です。
    - term: 社会的包摂
      description: 貧困や孤立によって社会から取り残されがちな人々を排除せず、誰もが役割や居場所を持てるように支え合う仕組みづくりです。
    - term: 社会保障制度
      description: 病気、失業、老後、介護など人生のリスクに対し、年金・医療保険・生活保護などの公的な仕組みで生活の安定を支えるセーフティネットです。

- id: education
  name: 教育学
  summary: 子どもから大人まで人が学び成長するプロセスを解明し、授業やカリキュラム、学校制度、家庭や地域での教育のあり方を理論と実践の両面から探究する学問です。
  misconception: 学校の先生になるための授業テクニックの練習
  terms:
    - term: カリキュラム
      description: 「何を、どの順番で、どのように学び、どう評価するか」を体系的に組み立てた、教育全体の設計図のことです。
    - term: 形成的評価
      description: テストで最終的な成績をつけるためではなく、学習の途中でつまずきを見つけて教え方や学び方を改善するための評価です。
    - term: インクルーシブ教育
      description: 障害の有無や文化的背景の違いにかかわらず、多様な子どもたちが同じ場で共に学び合えるよう環境や支援を整える教育のあり方です。
    - term: 生涯学習
      description: 学校を卒業したら学びが終わるのではなく、仕事や地域生活、趣味など人生のあらゆる段階で学び続けるという考え方です。

- id: psychology
  name: 心理学
  summary: 人間の知覚、記憶、感情、発達、対人関係などの心の働きを、行動の観察や実験、統計データ、面接調査にもとづいて科学的に解明する学問です。
  misconception: 相手の表情や仕草から本音を見抜く読心術
  terms:
    - term: 認知バイアス
      description: 思い込みや直感によって、情報を偏って集めたり不合理な判断をしてしまったりする、誰の心にも備わっている思考のクセです。
    - term: ワーキングメモリ
      description: 会話をしながら内容を理解したり暗算をしたりするときに、情報を一時的に頭の中に保ちながら処理する記憶の働きです。
    - term: アタッチメント
      description: 乳幼児期から養育者など特定の他者との間に築かれる安心感の絆であり、その後の対人関係や心の安定にも関わる概念です。
    - term: 認知行動療法
      description: つらい気分の背景にある「物事の受け止め方（認知）」と「行動のパターン」を見直し、ストレスに対処しやすくする心理支援の方法です。

- id: tourism-studies
  name: 観光学
  summary: 人の移動や旅行がもたらす経済効果、地域社会の活性化、文化の保全、環境への負荷などを多角的に分析し、持続可能な観光と地域づくりのあり方を研究する学問です。
  misconception: 旅行プラン作りやホテル・接客マナーの練習
  terms:
    - term: オーバーツーリズム
      description: 特定の観光地に訪問客が集中しすぎて、住民の生活環境が悪化したり渋滞や自然破壊が起きたりする課題のことです。
    - term: サステナブル・ツーリズム
      description: 目先の収益だけでなく、現地の自然環境や伝統文化、住民の暮らしを守りながら将来にわたって続けられる観光のあり方です。
    - term: デスティネーション・マネジメント
      description: 自治体、観光事業者、地域住民が連携し、地域全体を一つの魅力的な目的地として計画的に運営・発信していく取り組みです。
    - term: 文化観光
      description: ただ名所を見て回るだけでなく、その土地の歴史や芸術、伝統産業、人々の生活文化に触れて深い理解や体験を得る観光の形です。

- id: arts-media-design
  name: 芸術・映像・デザイン学
  summary: 美術、音楽、映像、プロダクト、情報デザインなどの表現や造形を対象に、人間の感性やコミュニケーションへの働きかけを作品制作と批評・理論の両面から探究する学問です。
  misconception: 生まれつき絵の才能やセンスがある人だけの世界
  terms:
    - term: アフォーダンス
      description: 椅子に座れるなど、人の身体や能力とモノ・環境との関係から生まれる、可能な行為のことです。操作方法を知らせる手がかりとは区別します。
    - term: ユーザーエクスペリエンス
      description: 製品やサービスを使う前後の使いやすさ、心地よさ、満足感など、利用者が体験する一連の質を捉えるデザインの視点です。
    - term: メディア論
      description: 本、テレビ、映画、スマートフォンなど情報を伝える媒体そのものが、人間の感じ方や社会のあり方をどう変えるかを考える領域です。
    - term: 表象文化論
      description: 絵画、写真、映画、アニメなどの視覚表現が、時代の価値観や欲望、権力関係をどのように映し出しているかを読み解く研究です。

- id: information-science
  name: 情報学
  summary: コンピュータや通信ネットワークの仕組みから、ソフトウェアの設計、セキュリティ、人と情報システムの関わりまで、情報を安全かつ効率的に扱う理論と技術を研究する学問です。
  misconception: パソコンの操作やプログラミング言語の文法だけを覚える勉強
  terms:
    - term: アルゴリズム
      description: 検索や並べ替え、経路探索などの問題を解くための計算手順や処理のルールです。目的に応じて、正確さや速さ、使うメモリを検討します。
    - term: 情報セキュリティ
      description: 暗号技術やアクセス管理などを用いて、個人情報やシステムを不正アクセス、改ざん、情報漏洩から守る理論と技術です。
    - term: ヒューマンコンピュータインタラクション
      description: 人間にとって迷わず安全で使いやすい画面や操作方法とは何かを、工学や心理学の知見を合わせて設計・評価する分野です。
    - term: 計算量
      description: 扱うデータの量が増えたときに、プログラムの実行時間や必要なメモリがどれくらい増えるかを見積もる効率の指標です。

- id: ai-data-science
  name: 人工知能・データサイエンス
  summary: 大量のデータから統計学や数理モデルを用いて意味のある法則を見つけ出し、機械学習などの技術によって予測・判断・生成を行う知的なシステムを構築する学問です。
  misconception: 既存のAIツールに指示を出して使いこなすだけの技術
  terms:
    - term: 機械学習
      description: 人間がすべてのルールを書き込む代わりに、例題データからパターンや予測の規則を学ばせる手法です。迷惑メールの判別などに使われます。
    - term: 深層学習
      description: 脳の神経回路を模した多層のモデルを使い、画像認識や音声認識、自然な文章の生成など複雑な特徴を自動で捉える技術です。
    - term: 過学習
      description: 練習用のデータに無理に合わせすぎた結果、未知の新しいデータに対してかえって予測が外れやすくなってしまう現象です。
    - term: 統計的推測
      description: アンケート回答者など一部のデータから、集団全体の傾向や関係を不確かさも含めて推定し、仮説を検討する方法です。

- id: electrical-electronics-robotics
  name: 電気電子・ロボティクス
  summary: 電力エネルギー、半導体・電子回路、通信・計測技術から、センサーと制御によって実世界で自律的に動くロボットまで、社会を支えるハードウェアと制御の仕組みを創る学問です。
  misconception: ハンダ付けやアニメのような人型ロボット作りだけの分野
  terms:
    - term: フィードバック制御
      description: センサーで現在の状態を測り、目標とのズレを計算してモーターなどの動きをリアルタイムに修正し続ける仕組みです。
    - term: 半導体デバイス
      description: 半導体の性質を利用して電流を制御したり、光と電気を変換したりする部品です。トランジスタ、LED、太陽電池などがあります。
    - term: アクチュエータ
      description: 電気や油圧などのエネルギーを、ロボットの腕を動かしたり車輪を回したりする物理的な動きに変換する駆動装置です。
    - term: パワーエレクトロニクス
      description: 半導体のスイッチングなどで電圧や周波数、直流・交流を変換し、電気を効率よく使う技術です。充電器や電気自動車などに使われます。

- id: biology-life-science
  name: 生物学・生命科学
  summary: DNAやタンパク質といった分子レベルから、細胞、個体、生態系、進化に至るまで、生き物が命を維持し環境に適応する精緻な仕組みを解明する学問です。
  misconception: 動植物の名前や体の部位を暗記するだけの科目
  terms:
    - term: 遺伝子発現
      description: DNAに記録された情報をもとにRNAやタンパク質が作られることです。どの遺伝子がいつ、どれだけ働くかが細胞の性質に関わります。
    - term: ホメオスタシス
      description: 外の気温や環境が変化しても、体温や血糖値など体内の状態を一定の範囲に保って命を守ろうとする仕組みです。
    - term: ゲノム編集
      description: 遺伝情報の特定の場所を狙って変化させる技術です。遺伝子の働きの研究、品種改良、医療への応用が進み、意図しない変化の確認も必要です。
    - term: 生態系
      description: ある場所に暮らす動物・植物・微生物と、光・水・土壌などの環境が、食物連鎖や物質の循環を通じて支え合っているまとまりです。

- id: pharmacy-drug-discovery
  name: 薬学・創薬科学
  summary: 病気の原因となる分子に働く新しい薬を化学・生物学的手法で創り出すとともに、薬が体内でどう吸収・作用・排出されるかを解明し、安全で適切な薬物治療を支える学問です。
  misconception: 病院や薬局で処方箋どおりに薬を袋に詰めるだけの仕事
  terms:
    - term: 薬物動態
      description: 飲んだり注射したりした薬が、体の中でどう吸収され、どこへ届き、どう分解されて体の外へ出ていくかを時間とともに追う考え方です。
    - term: 標的分子
      description: 病気の発症や進行に深く関わっており、薬が結合することで症状を抑えたり治療したりする狙い目となる体内のタンパク質などのことです。
    - term: ドラッグデリバリーシステム
      description: 副作用を減らし効果を高めるために、必要な量の薬を、体内の必要な場所へ、必要なタイミングに届けるための工夫と技術です。
    - term: 臨床試験
      description: 薬や治療法などの有効性・安全性を、人を対象に確かめる研究です。このうち、医薬品などの承認取得を目的とする試験を治験と呼びます。

- id: medicine-health-science
  name: 医学・健康科学
  summary: 人体の構造や機能、病気が起こるメカニズムを解明して診断・治療法を確立するとともに、看護・リハビリ・公衆衛生などを通じて人々の健康と生活の質を守る学問です。
  misconception: 手術や診察の手技だけを覚える職能訓練
  terms:
    - term: 病理学
      description: 細胞や組織の変化を顕微鏡などで詳しく調べ、病気がなぜ、どのようにして起きているのかという根本原因や診断根拠を突き止める分野です。
    - term: 疫学
      description: 地域や集団の中で病気や健康状態がどう広がっているかを統計的に調べ、生活習慣や環境などの原因と予防法を明らかにする学問です。
    - term: エビデンスに基づく医療
      description: 利用できる最良の研究結果、医療者の臨床経験・専門性、患者の価値観や状況を合わせ、その人に適した医療を選ぶ考え方です。
    - term: 予防医学
      description: 病気になってから治すだけでなく、ワクチンや生活習慣の改善、早期検診によって発症や重症化を未然に防ぐ取り組みです。

- id: environmental-science
  name: 環境科学
  summary: 気候変動、生物多様性の喪失、環境汚染などの問題について、自然科学の計測・分析と社会科学の制度設計を組み合わせて原因を解明し、持続可能な解決策を探る学問です。
  misconception: エコ活動やゴミ分別のマナーを呼びかける道徳教育
  terms:
    - term: カーボンニュートラル
      description: 二酸化炭素などの温室効果ガスの排出量を減らし、森林による吸収や回収技術と差し引きして実質ゼロに抑える目標と仕組みです。
    - term: ライフサイクルアセスメント
      description: 製品を作るための資源採取から製造、使用、廃棄・リサイクルまでの全過程で、どれだけ環境に負荷がかかるかを定量的に評価する手法です。
    - term: 生物多様性
      description: 生態系の多様さ、生物の種の多様さ、同じ種の中の遺伝的な違いを指します。こうした多様さとつながりが自然の恵みを支えています。
    - term: 環境影響評価
      description: 道路や発電所などの大規模な開発を行う前に、周囲の自然や住民の生活にどんな影響が出るかを調査・予測し、対策を講じる制度です。

- id: sports-science
  name: スポーツ科学
  summary: 運動時の筋肉・神経・心肺の働きや動作の力学、心理状態、栄養などを科学的に測定・分析し、競技力の向上やケガの予防、生涯にわたる健康づくりに活かす学問です。
  misconception: 体育の授業の延長や根性論での筋トレ
  terms:
    - term: バイオメカニクス
      description: 走る・投げる・跳ぶといった身体の動きをカメラやセンサーで計測し、物理の力学を使って効率のよいフォームや負担の少ない動作を解明する分野です。
    - term: 運動生理学
      description: 運動によって心拍数、呼吸、筋肉、ホルモンなどがどう変化し、トレーニングによって体がどう適応して強くなるかを調べる分野です。
    - term: 最大酸素摂取量
      description: 激しい運動中に体が1分間に取り込める酸素の最大量のことで、全身の持久力や有酸素運動の能力を測る代表的な指標です。
    - term: スポーツ心理学
      description: 本番での緊張やプレッシャーへの対処、集中力の維持、チームの結束など、運動のパフォーマンスと心の関係を扱う領域です。

- id: mathematics
  name: 数学・数理科学
  summary: 数・図形・空間・変化などの抽象的な構造を論理的な証明によって体系化するとともに、自然現象や社会現象を数理モデルとして記述・解明する学問です。
  misconception: 複雑な計算問題を速く解くための暗算や公式の暗記
  terms:
    - term: 公理系
      description: 理論の出発点として採用する前提の集まりです。例えば幾何学では、点や直線についての公理から、証明によって定理を導きます。
    - term: 位相空間
      description: 長さや角度を測らなくても、「つながっている」「近い」といった図形や空間の根本的な性質を扱うための抽象的な枠組みです。
    - term: 数理モデル
      description: 感染症の広がりや交通渋滞、天体の動きなど現実の複雑な現象を、数式を使って本質的な関係に書き表したものです。
    - term: 確率過程
      description: 株価の変動や分子の不規則な動きのように、時間の経過とともに偶然を含みながら変化していく現象を数学的に扱う理論です。

- id: physics-astronomy-earth-science
  name: 物理・天文・地球科学
  summary: 素粒子や物質のミクロな法則から、地球内部の変動や気象・海洋、さらには星や宇宙の成り立ちまで、自然界を貫く普遍的な法則を観測・実験・理論によって解き明かす学問です。
  misconception: 受験用の公式に数字を当てはめて答えを出すパズル
  terms:
    - term: 量子力学
      description: 原子や電子などの極めて小さな世界では、粒子が波の性質も併せ持つなど、日常の直感とは異なる法則で振る舞うことを記述する理論です。
    - term: 熱力学・統計力学
      description: 熱力学は温度・熱・仕事などの関係を扱い、統計力学は多数の粒子の状態から物質全体の性質を説明します。気体やエンジンなどの理解に使われます。
    - term: プレートテクトニクス
      description: 地球の表面を覆う固い岩盤が少しずつ動くことで、地震や火山活動、山脈の形成などが起こる仕組みを説明する地球科学の基本理論です。
    - term: 観測天文学
      description: 可視光だけでなく電波、赤外線、X線、重力波などを捉える望遠鏡や検出器を使い、遠く離れた星や銀河、初期宇宙の姿を調べる手法です。

- id: chemistry-materials-nanoscience
  name: 化学・材料・ナノ科学
  summary: 原子や分子の結合と反応の仕組みを解明し、ナノメートル単位の構造制御を通じて、電池・半導体・医療材料・環境触媒など新しい機能を持つ物質を設計・創出する学問です。
  misconception: 周期表の暗記や試験管の液体を混ぜて色を変える実験
  terms:
    - term: 化学結合
      description: 原子同士が電子を出し合ったり引き合ったりして結びつく仕組みのことで、物質の硬さや電気の通りやすさ、反応のしやすさを決める基本です。
    - term: 触媒
      description: 別の反応経路を可能にして化学反応を速める物質です。反応途中では変化しても再生され、反応全体では消費されません。排ガス浄化などに使われます。
    - term: ナノマテリアル
      description: おおむね1〜100ナノメートルの構造を持つ材料です。1ナノメートルは10億分の1メートルで、この小ささに由来する光学的・電気的性質などを利用します。
    - term: 高分子化学
      description: プラスチック、合成繊維、ゴム、さらには生体内の材料まで、小さな分子が鎖のように長くつながってできた物質の性質と合成を扱う分野です。

- id: architecture-civil-disaster-science
  name: 建築・土木・防災学
  summary: 住宅や公共建築の空間設計、橋・道路・上下水道などの社会インフラの構築、そして地震や水害などの自然災害から人命と都市機能を守る技術を総合的に探究する学問です。
  misconception: おしゃれな家の間取り図を描いたり工事現場で作業したりすること
  terms:
    - term: 耐震・免震構造
      description: 耐震は建物の強さや粘りで地震に耐える仕組み、免震は建物と地面の間の装置で揺れの伝わり方を抑える仕組みです。被害の軽減を目指します。
    - term: 都市計画
      description: 住宅、商業施設、公園、道路、鉄道などをどう配置すれば、安全で快適かつ環境に優しい街になるかを長期的な視点で設計する取り組みです。
    - term: インフラストラクチャー
      description: 道路、橋、トンネル、港湾、上下水道など、私たちが毎日当たり前に生活し経済活動を行うために不可欠な社会の土台となる施設です。
    - term: ハザードマップ
      description: 地形や過去の記録、シミュレーションにもとづいて、洪水や土砂災害、津波などの危険が及ぶ範囲と避難場所を地図上に示したものです。
