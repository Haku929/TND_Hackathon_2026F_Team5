name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # 通信なしの Python テスト（標準ライブラリだけで動くもの）
      - run: python3 -m unittest discover -s data -p "test_fetch_kaken.py"
      - run: python3 -m unittest discover -s data -p "test_assign_fields.py"
      - run: python3 -m unittest discover -s data -p "test_load_university.py"
      - run: npm run build
